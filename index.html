<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171A">
<title>Streetlifting</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Diseño original (sin cambios) ===== */
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#14171A;
    --surface:#1B1F23;
    --surface-2:#20252A;
    --line:#2B3137;
    --text:#EDEAE4;
    --text-muted:#8B939C;
    --iron:#C9472B;
    --iron-soft:rgba(201,71,43,.14);
    --tech:#5B8A93;
    --tech-soft:rgba(91,138,147,.14);
    --rest:#565D64;
    --gold:#C9A227;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F1EEE7; --surface:#FFFFFF; --surface-2:#F7F4EE; --line:#DBD5C8;
      --text:#1B1815; --text-muted:#6E6A61;
      --iron-soft:rgba(201,71,43,.10); --tech-soft:rgba(91,138,147,.12);
    }
  }
  :root[data-theme="light"]{
    --bg:#F1EEE7; --surface:#FFFFFF; --surface-2:#F7F4EE; --line:#DBD5C8;
    --text:#1B1815; --text-muted:#6E6A61;
    --iron-soft:rgba(201,71,43,.10); --tech-soft:rgba(91,138,147,.12);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));
  }
  .display{ font-family:"Barlow Condensed","Segoe UI Condensed",Impact,sans-serif; }
  .wrap{ max-width:640px; margin:0 auto; padding:20px 20px 12px; }

  .hero{ padding:4px 0 22px; border-bottom:1px solid var(--line); }
  .eyebrow{ margin:0 0 6px; font-size:13px; color:var(--text-muted); }
  .total{ display:flex; align-items:baseline; gap:8px; margin:0; font-weight:700; line-height:.9; }
  .totalnum{ font-size:clamp(56px,16vw,84px); color:var(--iron); }
  .totalunit{ font-size:20px; color:var(--text-muted); }
  .totallabel{ margin:6px 0 20px; font-size:13px; color:var(--text-muted); }

  .maxgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .maxgrid input.zero{ border-color:var(--gold); color:var(--gold); }
  .maxgrid label{ display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--text-muted); }
  .maxgrid input{
    font:600 20px/1 "Barlow Condensed",sans-serif; color:var(--text);
    background:var(--surface-2); border:1px solid var(--line); border-radius:3px;
    padding:9px 8px; width:100%;
  }
  .maxgrid input:focus{ outline:2px solid var(--iron); outline-offset:1px; }
  .footnote{ margin:14px 0 0; font-size:12px; line-height:1.5; color:var(--text-muted); }
  .bodystats{ margin:10px 0 0; font-size:12px; color:var(--text-muted); }

  .weeknav{ display:flex; gap:8px; padding:18px 0 0; }
  .wtab{
    flex:1; padding:10px 0; font:600 18px/1 "Barlow Condensed",sans-serif;
    background:var(--surface); border:1px solid var(--line); border-radius:3px;
    color:var(--text-muted); cursor:pointer;
  }
  .wtab.active{ background:var(--iron); border-color:var(--iron); color:#fff; }
  .weekfocus{ margin:10px 0 18px; font-size:13px; color:var(--text-muted); }

  .days{ display:flex; flex-direction:column; gap:12px; }
  .day{
    background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--rest);
    border-radius:3px; padding:14px 16px 16px;
  }
  .day.heavy{ border-left-color:var(--iron); }
  .day.tech{ border-left-color:var(--tech); }
  .day.done{ opacity:.55; }
  .dayhead{ display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; }
  .dayid{ display:flex; align-items:center; gap:8px; }
  .dnum{ font:600 15px/1 "Barlow Condensed",sans-serif; color:var(--text-muted); }
  .dtag{ font-size:11px; padding:2px 7px; border-radius:2px; color:var(--text-muted); background:var(--surface-2); }
  .day.heavy .dtag{ background:var(--iron-soft); color:var(--iron); }
  .day.tech .dtag{ background:var(--tech-soft); color:var(--tech); }
  .dname{ flex:1 0 100%; margin:4px 0 0; font:600 22px/1.15 "Barlow Condensed",sans-serif; }
  .day.done .dname{ text-decoration:line-through; }
  .chkwrap{ margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); cursor:pointer; }
  .chk{ width:17px; height:17px; accent-color:var(--iron); cursor:pointer; }

  .daybody{ margin-top:10px; }
  .exline{ display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px solid var(--line); font-size:14px; }
  .exline:first-child{ border-top:none; }
  .exline.main .exname{ font-weight:600; }
  .exname{ color:var(--text); }
  .exspec{ text-align:right; white-space:nowrap; color:var(--text-muted); }
  .exspec b{ color:var(--text); font-weight:600; }
  .pct{ font-size:12px; }
  .exline.extra .exname, .exline.mu .exname{ color:var(--text-muted); font-style:italic; }
  .cue{ margin:12px 0 0; padding:10px 12px; background:var(--surface-2); border-radius:3px; font-size:13px; line-height:1.5; color:var(--text-muted); }
  .note{ margin:0; font-size:14px; color:var(--text-muted); line-height:1.5; }
  .warmup{ margin:18px 2px 0; font-size:12px; line-height:1.6; color:var(--text-muted); }

  /* ===== Agregados para las funciones nuevas ===== */
  .topbar{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:0 0 16px; }
  .topnav{ margin-left:auto; display:flex; gap:6px; }
  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:6px 10px; border-radius:999px;
    border:1px solid var(--line); background:var(--surface); color:var(--text-muted); cursor:pointer; white-space:nowrap; }
  .pill::before{ content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .pill.synced{ color:var(--tech); }
  .pill.syncing::before{ animation:pulse 1s infinite; }
  .pill.pending{ color:var(--gold); }
  .pill.error{ color:var(--iron); }
  @keyframes pulse{ 50%{ opacity:.2; } }
  .navbtn{ font:600 15px/1 "Barlow Condensed",sans-serif; padding:7px 10px; border-radius:3px; border:1px solid var(--line);
    background:var(--surface); color:var(--text-muted); cursor:pointer; }
  .back{ font:600 16px/1 "Barlow Condensed",sans-serif; padding:7px 0; background:none; border:none; color:var(--text-muted); cursor:pointer; }

  .btn{ font:600 17px/1 "Barlow Condensed",sans-serif; padding:11px 14px; border-radius:3px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text); cursor:pointer; }
  .btn.primary{ background:var(--iron); border-color:var(--iron); color:#fff; }
  .btn.ghost{ background:transparent; }
  .btn.sm{ font-size:15px; padding:8px 11px; }
  .btn.block{ display:block; width:100%; margin-top:12px; }
  .btn.danger{ color:var(--iron); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .linkbtn{ background:none; border:none; padding:0; font:inherit; color:var(--text); text-decoration:underline;
    text-decoration-color:var(--line); text-underline-offset:3px; cursor:pointer; }
  .dayactions{ margin-top:12px; display:flex; gap:8px; }
  .exlink{ cursor:pointer; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; }
  .exnote{ display:block; font-size:12px; color:var(--text-muted); font-style:normal; margin-top:2px; }
  .dtag.live{ background:rgba(201,162,39,.15); color:var(--gold); }

  .vtitle{ font:600 28px/1.1 "Barlow Condensed",sans-serif; margin:2px 0 6px; }
  .vsub{ font-size:13px; line-height:1.5; color:var(--text-muted); margin:0 0 16px; }
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:14px 16px; margin-top:14px; }
  .panel h3{ margin:0 0 6px; font:600 20px/1.1 "Barlow Condensed",sans-serif; }

  .block{ background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--rest); border-radius:3px;
    padding:14px 14px; margin-bottom:12px; }
  .block.main{ border-left-color:var(--iron); }
  .block.technique, .block.mobility, .block.skill{ border-left-color:var(--tech); }
  .blockhead{ display:flex; align-items:flex-start; gap:10px; }
  .bname{ flex:1; font:600 20px/1.15 "Barlow Condensed",sans-serif; }
  .presc{ font-size:13px; line-height:1.45; color:var(--text-muted); margin:6px 0 0; }
  .presc b{ color:var(--text); }
  .lastline{ font-size:12px; color:var(--text-muted); margin:4px 0 0; }
  .setgrid{ margin:10px 0; display:flex; flex-direction:column; gap:6px; }
  .setrow{ display:grid; grid-template-columns:18px 1fr 1fr .7fr 1.45fr 30px; gap:6px; align-items:center; }
  .setrow.head{ font-size:11px; color:var(--text-muted); }
  .snum{ font:600 15px/1 "Barlow Condensed",sans-serif; color:var(--text-muted); }
  .setrow input, .setrow select, .field input, .field select, .field textarea{
    font:500 16px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); background:var(--surface-2); border:1px solid var(--line); border-radius:3px;
    padding:8px 6px; width:100%; min-width:0; }
  .setrow select{ font-size:14px; padding:8px 2px; }
  .field textarea{ resize:vertical; }
  .xbtn{ width:30px; height:34px; border:1px solid var(--line); background:var(--surface-2); color:var(--text-muted);
    border-radius:3px; cursor:pointer; font-size:14px; padding:0; }
  .xbtn:disabled{ opacity:.3; cursor:default; }
  .field{ display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--text-muted); margin-bottom:12px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .statetxt{ font-size:15px; color:var(--text); padding:9px 0; }

  .stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 14px; }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:10px 12px; }
  .stat span{ display:block; font-size:11px; color:var(--text-muted); }
  .stat b{ display:block; font:600 22px/1.1 "Barlow Condensed",sans-serif; margin-top:3px; }
  .stat small{ display:block; font-size:11px; color:var(--text-muted); margin-top:2px; }
  .chartbox{ background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:10px 8px 6px; }
  .chart{ width:100%; height:auto; display:block; }
  .legend{ display:flex; gap:14px; font-size:11px; color:var(--text-muted); padding:4px 6px 0; }
  .legend i{ display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:5px; }
  .sesslist{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .sessitem{ background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:10px 12px; }
  .sesshead{ display:flex; justify-content:space-between; gap:10px; font-size:13px; }
  .sesshead span{ color:var(--text-muted); }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chipx{ font-size:13px; padding:4px 8px; background:var(--surface-2); border-radius:3px; }
  .chipx.pr{ outline:1px solid var(--gold); }
  .chipx em{ font-style:normal; font-size:10px; color:var(--gold); margin-left:4px; }

  .rexrow{ display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
  .rexrow:first-child{ border-top:none; }
  .rexinfo{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; font-size:14px; }
  .rexinfo .exspec{ text-align:left; white-space:normal; font-size:13px; }
  .rexbtns{ display:flex; gap:4px; }

  .libgroup{ margin-top:16px; }
  .libgroup h4{ margin:0 0 6px; font-size:12px; font-weight:600; color:var(--text-muted); }
  .libitem{ display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:11px 12px; margin-bottom:6px;
    color:var(--text); font-size:15px; cursor:pointer; }
  .libitem span{ font-size:12px; color:var(--text-muted); white-space:nowrap; }

  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .sheet{ background:var(--surface); width:100%; max-width:640px; max-height:90vh; overflow:auto;
    border-radius:8px 8px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px)); }
  .sheet h3{ margin:0 0 12px; font:600 24px/1.1 "Barlow Condensed",sans-serif; }
  .sheetbtns{ display:flex; gap:8px; margin-top:6px; }
  .sheetbtns .btn{ flex:1; }
  .msg{ font-size:13px; color:var(--text-muted); margin:10px 0 0; line-height:1.5; }
  .msg.err{ color:var(--iron); }
  pre.summary{ white-space:pre-wrap; font-size:12px; background:var(--surface-2); padding:10px; border-radius:3px; max-height:40vh; overflow:auto; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<script>
'use strict';
/* =====================================================================
   Streetlifting — app local-first sincronizada con Google Sheets.
   Datos fuente en el Sheet; aquí solo se guarda una copia + cola de cambios.
   ===================================================================== */

const PK = { PROFILE:'key', EXERCISES:'exercise_id', ROUTINES:'routine_id', ROUTINE_DAYS:'day_id',
  ROUTINE_EXERCISES:'rex_id', SESSIONS:'session_id', SETS:'set_id', BODY_METRICS:'metric_id', GOALS:'goal_id' };
const REX = 'ROUTINE_EXERCISES';
const MAIN_LIFTS = [['back_squat','Sentadilla', null], ['weighted_pullup','Dominada +', null], ['weighted_dip','Fondo +', null], ['muscle_up','Muscle up +', 0]];
function mainMax(id) { const v = refMax(id); if (v != null) return v; const m = MAIN_LIFTS.find((x) => x[0] === id); return m ? m[2] : null; }
const DAYTYPE_LABEL = { heavy:'Pesado', tech:'Técnica', rest:'Descanso' };
const ROLES = [['main','Principal'], ['accessory','Accesorio'], ['technique','Técnica'], ['mobility','Movilidad'], ['skill','Skill']];
const EX_TYPES = [['main','Principal'], ['variant','Variante'], ['accessory','Accesorio'], ['technique','Técnica'], ['mobility','Movilidad'], ['skill','Skill']];
const LOAD_MODES = [['barbell','Barra (peso total)'], ['added_weight','Lastre (peso corporal + kg)'], ['external','Carga externa'], ['bodyweight','Peso corporal'], ['time','Por tiempo']];
const LOAD_TYPES = [['','Sin carga fija'], ['pct','% del máximo'], ['kg','kg'], ['added_kg','Lastre (kg)'], ['bodyweight','Peso corporal']];
const SET_TYPES = [['working','Efectiva'], ['warmup','Aprox.'], ['top','Top'], ['backoff','Back-off'], ['amrap','AMRAP'], ['test','Test']];
const SYNC_LABEL = { synced:'Sincronizado', syncing:'Sincronizando...', pending:'Cambios pendientes', error:'Error de sincronización' };

let db = { tables:{}, outbox:{}, config:{ apiUrl:'', token:'' }, meta:{ lastSyncAt:null, lastPullAt:null } };
for (const t in PK) db.tables[t] = {};
let ui = { view:'home', prevView:'home', week:null, sess:null, exId:null, editWeek:null, modal:null, subs:{}, extras:{}, connMsg:'' };
const syncState = { state:'synced', timer:null, inFlight:false, again:false, lastError:null };

/* ============================ ALMACENAMIENTO LOCAL ============================ */
const store = {
  idb: null, mem: {},
  async open() {
    try {
      this.idb = await new Promise((res, rej) => {
        const r = indexedDB.open('streetlifting', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch (e) { this.idb = null; }
  },
  get(k) {
    if (!this.idb) {
      try { const v = localStorage.getItem('sl_' + k); return Promise.resolve(v ? JSON.parse(v) : this.mem[k]); }
      catch (e) { return Promise.resolve(this.mem[k]); }
    }
    return new Promise((res) => {
      try { const q = this.idb.transaction('kv', 'readonly').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }
      catch (e) { res(undefined); }
    });
  },
  set(k, v) {
    if (!this.idb) {
      try { localStorage.setItem('sl_' + k, JSON.stringify(v)); } catch (e) { this.mem[k] = v; }
      return Promise.resolve();
    }
    return new Promise((res) => {
      try { const tx = this.idb.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); }
      catch (e) { res(); }
    });
  }
};
let tablesTimer = null;
function saveCritical() { store.set('outbox', db.outbox); store.set('meta', db.meta); }
function saveTables(now) { clearTimeout(tablesTimer); if (now) return store.set('tables', db.tables); tablesTimer = setTimeout(() => store.set('tables', db.tables), 400); }
function saveConfig() { store.set('config', db.config); }
function saveUi() { store.set('ui', { subs: ui.subs, extras: ui.extras }); }

/* ============================ UTILIDADES ============================ */
const pad2 = (n) => (n < 10 ? '0' : '') + n;
function todayLocal() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function tsAfter(prev) { let t = new Date().toISOString(); if (prev && t <= prev) t = new Date(Date.parse(prev) + 1).toISOString(); return t; }
function uid(p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function fmt(n) { if (n == null || n === '' || isNaN(n)) return ''; return String(Math.round(Number(n) * 100) / 100); }
function fmtDate(d) { if (!d) return ''; const p = d.split('-'); const y = String(new Date().getFullYear()); return p.length === 3 ? p[2] + '/' + p[1] + (p[0] !== y ? '/' + p[0].slice(2) : '') : d; }
function daysAgo(d) { if (!d) return ''; const a = Date.parse(d + 'T00:00:00'); const b = Date.parse(todayLocal() + 'T00:00:00'); const n = Math.round((b - a) / 86400000); return n <= 0 ? 'hoy' : n === 1 ? 'ayer' : 'hace ' + n + ' días'; }
function minusDays(d, n) { const t = new Date(Date.parse(d + 'T12:00:00') - n * 86400000); return t.getFullYear() + '-' + pad2(t.getMonth() + 1) + '-' + pad2(t.getDate()); }
function num(v) { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; }
function int(v) { const n = num(v); return n == null ? null : Math.round(n); }
function options(list, sel) { return list.map(([v, l]) => '<option value="' + esc(v) + '"' + (String(v) === String(sel == null ? '' : sel) ? ' selected' : '') + '>' + esc(l) + '</option>').join(''); }
const range = (n) => Array.from({ length: n }, (_, i) => i + 1);
function isEditingInput() { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }
function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }

/* ============================ DATOS ============================ */
const alive = (r) => !!r && !r.deleted_at;
function rows(t) { return Object.values(db.tables[t]).filter(alive); }
function profile(key) { const r = db.tables.PROFILE[key]; return alive(r) ? r.value : null; }
function refMax(exId) { const v = num(profile('ref_max.' + exId)); return v; }
function exercise(id) { return db.tables.EXERCISES[id] || null; }
function exName(id) { const e = exercise(id); return e ? e.name : (id || '—'); }
function isAdded(exId) { const e = exercise(exId); return !!e && (e.load_mode === 'added_weight' || e.load_mode === 'bodyweight'); }

function put(table, patch) {
  const pk = PK[table]; const id = patch[pk];
  if (!id) throw new Error('Fila sin id en ' + table);
  const prev = db.tables[table][id];
  const t = tsAfter(prev && prev.updated_at);
  const row = Object.assign({}, prev || {}, patch, { updated_at: t });
  if (!row.created_at) row.created_at = t;
  if (row.deleted_at === undefined) row.deleted_at = null;
  db.tables[table][id] = row;
  db.outbox[table + '|' + id] = { table, row };
  saveCritical(); saveTables();
  return row;
}
function softDelete(table, id) { return put(table, { [PK[table]]: id, deleted_at: new Date().toISOString() }); }

function bodyweight(date) {
  const list = rows('BODY_METRICS').filter((m) => m.metric === 'weight_kg' && m.value != null)
    .sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.created_at || '').localeCompare(b.created_at || ''));
  if (!list.length) return null;
  if (!date) return list[list.length - 1].value;
  let best = null; list.forEach((m) => { if ((m.date || '') <= date) best = m; });

/* ============================ SINCRONIZACIÓN ============================ */
const pendingCount = () => Object.keys(db.outbox).length;

}

  if (!j.ok) throw Object.assign(new Error(j.error === 'unauthorized' ? 'Token incorrecto.' : (j.error + (j.message ? ': ' + j.message : ''))), { kind: 'server' });

}

  (res.applied || []).forEach((a) => { const k = a.table + '|' + a.id; const e = db.outbox[k]; if (e && e.row.updated_at === a.updated_at) delete db.outbox[k]; });

    for (const k of Object.keys(db.outbox)) {

    syncState.inFlight = false;
    syncState.lastError = isNetErr(e) ? 'Sin conexión: mostrando los datos guardados en el teléfono.' : e.message;

function ensureSession(dayId, w) {

  const d = db.tables.ROUTINE_DAYS[dayId];
  return put('SESSIONS', { session_id: uid('ses'), date: todayLocal(), routine_id: d ? d.routine_id : null, day_id: dayId, week: w,
    started_at: new Date().toISOString(), finished_at: null, notes: null });
}
function blockSets(sid, rexId, exId) {

}

  const rex = rexId ? db.tables[REX][rexId] : null;
  const existing = blockSets(s.session_id, rexId, exId);

  const timeBased = (rex && rex.unit === 's') || (exercise(exId) && exercise(exId).load_mode === 'time');
  const row = { set_id: uid('set'), session_id: s.session_id, exercise_id: exId, rex_id: rexId || null, set_number: existing.length + 1,
    weight_kg: null, reps: null, duration_sec: null, rir: null, set_type: 'working', notes: null };

    const first = int(String(rex.reps || '').split('-')[0]);

  }
  put('SETS', row); changed(false);
}

  if (!s) return;
  if (on) put('SESSIONS', { session_id: s.session_id, finished_at: new Date().toISOString() });
  else if (!setsOf(s.session_id).length) softDelete('SESSIONS', s.session_id);
  else put('SESSIONS', { session_id: s.session_id, finished_at: null });

/* Edición hacia adelante: nunca se reescribe una prescripción que ya tiene series registradas */
function stripMeta(r) { const c = Object.assign({}, r); delete c.created_at; delete c.updated_at; delete c.deleted_at; return c; }

function forwardEdit(rexId, patch, N) {

  const used = rows('SETS').some((x) => x.rex_id === rexId);
  const moving = patch.day_id && patch.day_id !== r.day_id;
  if (moving) patch.position = nextPos(patch.day_id, N);
  if ((r.week_from || 1) < N) {
    put(REX, { rex_id: rexId, week_to: N - 1 });
    put(REX, Object.assign(stripMeta(r), patch, { rex_id: uid('rex'), week_from: N, week_to: r.week_to }));
  } else if (used) {

}

/* ---------- Importar bloque / resumen para Claude ---------- */
const IMPORTABLE = ['PROFILE', 'EXERCISES', 'ROUTINES', 'ROUTINE_DAYS', 'ROUTINE_EXERCISES', 'GOALS', 'BODY_METRICS'];
function parseImport(text) {
  let o; try { o = JSON.parse(text); } catch (e) { return { error: 'No es un JSON válido.' }; }

  const out = {};

    if (!Array.isArray(tables[t])) return { error: t + ' debe ser una lista.' };
    for (const r of tables[t]) if (!r || !r[PK[t]]) return { error: 'Hay una fila de ' + t + ' sin ' + PK[t] + '.' };
    out[t] = tables[t];
  }
  const exIds = new Set(Object.keys(db.tables.EXERCISES).concat((out.EXERCISES || []).map((e) => e.exercise_id)));
  for (const r of (out.ROUTINE_EXERCISES || [])) if (!exIds.has(r.exercise_id)) return { error: 'El ejercicio "' + r.exercise_id + '" no existe en la biblioteca ni en el bloque.' };

  if (newActive.length) rows('ROUTINES').forEach((r) => { if (r.status === 'active' && newActive.indexOf(r.routine_id) === -1) put('ROUTINES', { routine_id: r.routine_id, status: 'completed' }); });

function buildSummary() {

    Object.values(groups).forEach((g) => {
      const rex = g[0].rex_id ? db.tables[REX][g[0].rex_id] : null; const ex = exercise(g[0].exercise_id); const mode = ex ? ex.load_mode : '';

function chartSvg(points, series) {
  const W = 320, H = 150, pl = 36, pr = 10, pt = 10, pb = 22;
  const vals = []; series.forEach((s) => points.forEach((p) => { if (p[s.key] != null) vals.push(p[s.key]); }));
  if (points.length < 2 || !vals.length) return '<p class="note">El gráfico aparece a partir de la segunda sesión registrada.</p>';
  let min = Math.min(...vals), max = Math.max(...vals); if (min === max) { min -= 1; max += 1; }
  const padv = (max - min) * 0.12; min -= padv; max += padv;
  const x = (i) => pl + (W - pl - pr) * (i / (points.length - 1)); const y = (v) => pt + (H - pt - pb) * (1 - (v - min) / (max - min));
  let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img" aria-label="Progreso">';
  for (let k = 0; k < 3; k++) { const v = min + (max - min) * (k / 2); const yy = y(v).toFixed(1);
    g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"/><text x="' + (pl - 5) + '" y="' + (Number(yy) + 3) + '" text-anchor="end" font-size="9" fill="var(--text-muted)">' + fmt(Math.round(v * 10) / 10) + '</text>'; }
  series.forEach((s) => {
    const pts = points.map((p, i) => (p[s.key] != null ? [x(i), y(p[s.key])] : null)).filter(Boolean);
    if (!pts.length) return;
    g += '<polyline fill="none" stroke="' + s.color + '" stroke-width="2"' + (s.dash ? ' stroke-dasharray="4 3"' : '') + ' points="' + pts.map((q) => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ') + '"/>';
    pts.forEach((q) => { g += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="2.6" fill="' + s.color + '"/>'; });
  });
  g += '<text x="' + pl + '" y="' + (H - 6) + '" font-size="9" fill="var(--text-muted)">' + esc(points[0].label) + '</text><text x="' + (W - pr) + '" y="' + (H - 6) + '" font-size="9" text-anchor="end" fill="var(--text-muted)">' + esc(points[points.length - 1].label) + '</text></svg>';
  return g + '<div class="legend">' + series.map((s) => '<span><i style="background:' + s.color + '"></i>' + esc(s.label) + '</span>').join('') + '</div>';
}

    if (!cur || e.row.updated_at >= (cur.updated_at || '')) db.tables[e.table][id] = e.row;

    const last = Date.parse(db.meta.lastPullAt || 0) || 0;
    if (Date.now() - last > 15 * 60 * 1000) pull(); else if (pendingCount()) pushNow();
  }
});
